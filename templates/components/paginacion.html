{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Paginación">
  {% if page_obj.has_previous %}<a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" rel="prev">← Anterior</a>{% else %}<span class="page-link is-disabled">← Anterior</span>{% endif %}
  <span class="page-count">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}" rel="next">Siguiente →</a>{% else %}<span class="page-link is-disabled">Siguiente →</span>{% endif %}
</nav>
{% endif %}
