{% comment %}Uso: {% include "components/campo_formulario.html" with field=form.nombre %}{% endcomment %}
<div class="form-field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark" aria-hidden="true"> *</span><span class="sr-only"> (obligatorio)</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small class="field-help">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<p class="field-error" role="alert">{{ error }}</p>{% endfor %}
</div>
